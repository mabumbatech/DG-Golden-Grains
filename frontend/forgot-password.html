<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — GOLDEN GRAINS</title>
<script src="js/manifest-init.js"></script>
<link rel="icon" href="assets/logo1.png">
<meta name="theme-color" content="#062E1A">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth-animated.css">
</head>
<body>

<div class="lg-page">
  <span class="lg-orb o1"></span><span class="lg-orb o2"></span><span class="lg-orb o3"></span>
  <div class="lg-grains" id="grains" aria-hidden="true"></div>

  <main class="lg-shell">

    <!-- Brand showcase -->
    <section class="lg-brand">
      <div class="lg-logo">
        <span class="lg-ring r3"></span>
        <span class="lg-ring r1"></span>
        <span class="lg-ring r2"></span>
        <img src="assets/hero-logo.png" alt="GOLDEN GRAINS">
      </div>
      <h1 class="lg-title">DG GOLDEN GRAINS</h1>
      <p class="lg-tagline">Quality in Every Grain</p>
      <div class="lg-chips">
        <span class="lg-chip active" id="chip1">1 · Find your account</span>
        <span class="lg-chip" id="chip2">2 · Answer your question</span>
        <span class="lg-chip" id="chip3">3 · Set a new password</span>
      </div>
    </section>

    <!-- Reset card -->
    <section class="lg-card" id="card">
      <h2>Reset your password <span class="lg-wave">🔑</span></h2>
      <p class="lg-sub" id="stepSub">Enter your username to begin</p>

      <div class="lg-steps" aria-hidden="true">
        <span class="lg-step-dot active" id="dot1"></span>
        <span class="lg-step-dot" id="dot2"></span>
      </div>

      <div class="lg-error" id="err" role="alert"></div>

      <!-- Step 1: find username -->
      <form id="step1Form">
        <div class="lg-field">
          <label for="username">Username</label>
          <div class="lg-input-wrap">
            <input type="text" id="username" required placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false">
            <svg class="lg-ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
        </div>
        <button type="submit" class="lg-btn lg-btn-solo" id="btn1">
          <span class="lg-btn-text">Continue</span>
          <svg class="arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <!-- Step 2: answer + new password -->
      <form id="step2Form" class="hidden">
        <div class="lg-question">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <span id="questionLabel">Security Question</span>
        </div>

        <div class="lg-field">
          <label for="answer">Your answer</label>
          <div class="lg-input-wrap">
            <input type="text" id="answer" required placeholder="Type your answer" autocomplete="off">
            <svg class="lg-ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </div>
        </div>

        <div class="lg-field">
          <label for="newPassword">New Password</label>
          <div class="lg-input-wrap">
            <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
            <svg class="lg-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <button type="button" class="lg-eye" data-target="newPassword" aria-label="Show password">
              <svg class="show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="lg-field">
          <label for="newPassword2">Confirm New Password</label>
          <div class="lg-input-wrap">
            <input type="password" id="newPassword2" required minlength="6" placeholder="Type it again" autocomplete="new-password">
            <svg class="lg-ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <button type="button" class="lg-eye" data-target="newPassword2" aria-label="Show password">
              <svg class="show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
          <p class="lg-hint" id="matchHint"></p>
        </div>

        <button type="submit" class="lg-btn lg-btn-solo" id="btn2">
          <span class="lg-btn-text">Reset Password</span>
          <svg class="arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="lg-links">
        <a href="login.html">&larr; Back to log in</a>
        <a href="index.html">Homepage</a>
      </div>
      <p class="lg-secure">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        Secure staff access
      </p>
    </section>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  const err = document.getElementById('err');
  const card = document.getElementById('card');
  let username = '';

  // Floating golden grains in the background
  (function makeGrains() {
    const box = document.getElementById('grains');
    const count = window.innerWidth < 600 ? 14 : 26;
    for (let i = 0; i < count; i++) {
      const g = document.createElement('span');
      g.className = 'lg-grain';
      g.style.setProperty('--x', (Math.random() * 100).toFixed(1) + '%');
      g.style.setProperty('--s', (5 + Math.random() * 9).toFixed(1) + 'px');
      g.style.setProperty('--d', (9 + Math.random() * 12).toFixed(1) + 's');
      g.style.setProperty('--delay', (-Math.random() * 20).toFixed(1) + 's');
      g.style.setProperty('--b', (Math.random() < 0.3 ? 1.5 : 0) + 'px');
      box.appendChild(g);
    }
  })();

  // Show / hide password buttons
  document.querySelectorAll('.lg-eye').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('on', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });

  // Live "passwords match" hint
  const p1El = document.getElementById('newPassword');
  const p2El = document.getElementById('newPassword2');
  const hint = document.getElementById('matchHint');
  function checkMatch() {
    if (!p2El.value) { hint.textContent = ''; hint.className = 'lg-hint'; return; }
    const ok = p1El.value === p2El.value;
    hint.textContent = ok ? '✓ Passwords match' : 'Passwords do not match yet';
    hint.className = 'lg-hint ' + (ok ? 'ok' : 'bad');
  }
  p1El.addEventListener('input', checkMatch);
  p2El.addEventListener('input', checkMatch);

  function showError(msg) {
    err.textContent = msg;
    err.classList.add('show');
    card.classList.remove('shake');
    void card.offsetWidth; // restart the shake animation
    card.classList.add('shake');
  }

  function setLoading(btn, on, idleText) {
    btn.disabled = on;
    btn.querySelector('.lg-btn-text').textContent = on ? 'Please wait...' : idleText;
    const arrow = btn.querySelector('.arrow');
    let sp = btn.querySelector('.lg-spinner');
    if (on && !sp) { sp = document.createElement('span'); sp.className = 'lg-spinner'; btn.appendChild(sp); }
    if (!on && sp) sp.remove();
    arrow.style.display = on ? 'none' : '';
  }

  document.getElementById('step1Form').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    username = document.getElementById('username').value.trim();
    const btn = document.getElementById('btn1');
    setLoading(btn, true, 'Continue');

    const res = await API.auth('forgot_password.php', { step: 'find', username });
    setLoading(btn, false, 'Continue');

    if (!res.success) { showError(res.message); return; }

    document.getElementById('questionLabel').textContent = res.data.security_question;
    document.getElementById('step1Form').classList.add('hidden');
    const f2 = document.getElementById('step2Form');
    f2.classList.remove('hidden');
    f2.classList.add('lg-form-in');
    document.getElementById('stepSub').textContent = 'Answer your security question';
    document.getElementById('dot1').className = 'lg-step-dot done';
    document.getElementById('dot2').className = 'lg-step-dot active';
    document.getElementById('chip1').className = 'lg-chip';
    document.getElementById('chip2').className = 'lg-chip active';
    document.getElementById('answer').focus();
  });

  document.getElementById('step2Form').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');

    const p1 = p1El.value;
    const p2 = p2El.value;
    if (p1 !== p2) { showError('New passwords do not match.'); return; }

    document.getElementById('chip2').className = 'lg-chip';
    document.getElementById('chip3').className = 'lg-chip active';
    const btn = document.getElementById('btn2');
    setLoading(btn, true, 'Reset Password');

    const res = await API.auth('forgot_password.php', {
      step: 'reset',
      username,
      security_answer: document.getElementById('answer').value.trim(),
      new_password: p1,
    });

    if (!res.success) {
      setLoading(btn, false, 'Reset Password');
      document.getElementById('chip3').className = 'lg-chip';
      document.getElementById('chip2').className = 'lg-chip active';
      showError(res.message);
      return;
    }
    toast('Password reset. Please log in.');
    setTimeout(() => window.location.href = 'login.html', 1200);
  });
</script>
</body>
</html>
